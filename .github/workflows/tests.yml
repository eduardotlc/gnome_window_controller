name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor is 3.12: colors.py uses a PEP 695 `type` statement, which earlier
        # interpreters cannot even parse.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PyGObject build dependencies
        # PyGObject ships no wheels on PyPI, so pip compiles it here. girepository-2.0 is what
        # PyGObject 3.52+ builds against; it is packaged from Ubuntu 24.04 onwards.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libcairo2-dev \
            libgirepository-2.0-dev \
            gir1.2-glib-2.0

      - name: Build the distributions
        # Catches packaging faults a plain install would not: a missing file in the sdist, bad
        # metadata, a README PyPI would reject.
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the built wheel
        # Installing the wheel rather than the source tree is what proves the shell extension
        # and the completions actually ship inside it. The `[test]` extra has to come along or
        # the test step has no pytest; a glob cannot carry one, hence the expansion.
        run: python -m pip install "$(echo dist/*.whl)[test]"

      - name: Smoke-test the installed console script
        # Proves the entry point resolves and the package imports, which the test suite itself
        # does not check: it runs against the checkout, not the installed copy.
        run: |
          gnome-window-controller --version
          gnome-window-controller --help

      - name: Check the wheel carries its data files
        run: |
          python - <<'PY'
          from importlib.resources import files
          root = files("gnome_window_controller")
          for name in ("py.typed", "completions/gnome-window-controller.bash",
                       "completions/_gnome-window-controller"):
              assert (root / name).is_file(), f"missing from the wheel: {name}"
          uuid = "gnome-window-controller@eduardotcampos.hotmail.com"
          for name in ("extension.js", "metadata.json", "prefs.js"):
              assert (root / "shell_extension" / uuid / name).is_file(), name
          print("wheel contents ok")
          PY

      - name: Run the tests
        # Only tests/. The doctests through the package are written against a live GNOME Shell --
        # they open windows and read the focused one -- so they cannot pass on a headless runner,
        # which is why `pytest` with no arguments is not what runs here.
        #
        # -rs lists every skip. The tests that need a GNOME session skip themselves here, and
        # that has to stay visible in the log rather than reading as a clean pass.
        run: python -m pytest tests/ -v -rs
