# Read the Docs build configuration.
#
# The package imports PyGObject lazily, so autodoc can import every module here without `gi`,
# without a session bus and without GNOME. Only the docs extra is installed.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - pkg-config
    - libcairo2-dev
    - libgirepository-2.0-dev
    - gir1.2-glib-2.0

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - htmlzip
